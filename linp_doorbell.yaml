esphome:
  name: linp_doorbell
          
# Configure the board; the G6L-WIFI uses a single-core ESP32.
esp32:
  board: esp32doit-devkit-v1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y
    advanced:
      ignore_efuse_mac_crc: True
      # Required for ESPHome v2024.10 and later - see issue #9
      # Remove for earlier ESPHome versions, which don't support this option.
      ignore_efuse_custom_mac: True

external_components:
  - source: github://akaivp/esphome-linp-doorbell-g03@feature/external_components
    components: [ linp_doorbell ]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Home Assistant API
api:
  key: !secret linp_doorbell_api_key

# Enable over-the-air updates
ota:
  - platform: esphome
    password: !secret ota_pwd

# Enable logging
logger:
  level: DEBUG

captive_portal:

web_server:
  port: 80

sensor:
  - platform: linp_doorbell
    volume:
      name: "Doorbell volume"
    chime_playing:
      name: "Doorbell playing tune"
#    use_old_service_names: True
